name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: iba-prod-backend
  AWS_ROLE_ARN: arn:aws:iam::443370672158:role/iba-prod-github-remove-backend
  HELM_REPOSITORY: AMBarodzich/remove-helmcharts
  HELM_CHART: remove-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push production image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --target production \
            --provenance=false \
            --sbom=false \
            --platform linux/amd64 \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --push \
            .

      - name: Checkout Helm charts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPOSITORY }}
          token: ${{ secrets.HELMCHARTS_TOKEN }}
          path: helmcharts
          ref: main

      - name: Point Helm chart at the new image
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: helmcharts
        run: |
          sed -i "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" "$HELM_CHART/values.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HELM_CHART/values.yaml"
          if git diff --cached --quiet; then
            echo "image tag already set"
            exit 0
          fi
          git commit -m "chore(${HELM_CHART}): deploy image ${IMAGE_TAG}"
          git push
